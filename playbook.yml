---
- name: Automatizacion de tareas en servidores Ubuntu
  hosts: servidores_ubuntu
  become: yes

  tasks:
    - name: 1. Actualizar la caché de APT
      apt:
        update_cache: yes

    - name: 2. Crear el usuario itla
      user:
        name: itla
        state: present
        shell: /bin/bash

    - name: 3. Crear una carpeta llamada 'app'
      file:
        path: /home/ansible/app
        state: directory
        owner: ansible
        group: ansible
        mode: '0755'

    - name: 4. Crear un archivo hola.txt en la carpeta app
      copy:
        content: "Hola Mundo desde Ansible automatizado!\n"
        dest: /home/ansible/app/hola.txt
        owner: ansible
        group: ansible
        mode: '0644'

    - name: 5. Instalar las aplicaciones cowsay y htop
      apt:
        name:
          - cowsay
          - htop
        state: present